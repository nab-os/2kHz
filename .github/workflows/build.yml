name: build

# Ubuntu 24.04 and 26.04 are built on their own runners rather than in
# containers, because the whole point of shipping two .debs is that each links
# against its own release's webkit and glibc. `ubuntu-latest` is deliberately
# not used: it migrates from 24.04 to 26.04 between 2026-10-19 and 2026-11-19,
# which would silently turn the 24.04 leg into a second 26.04 leg.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.96.0"
  DX_VERSION: "0.7.10"
  MAINTAINER: "nab-os <9805355+nab-os@users.noreply.github.com>"

jobs:
  # ---------------------------------------------------------------- linux
  linux:
    name: ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ["24.04", "26.04"]

    steps:
      - uses: actions/checkout@v5

      # libwebkit2gtk-4.1 is what wry 0.53 links against, and it exists on
      # both releases. libxdo/libappindicator come in via tao and tray-icon.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config dpkg-dev file \
            libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libxdo-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            app
            server
          key: ubuntu-${{ matrix.ubuntu }}

      # Prebuilt dx: `cargo install dioxus-cli` is a ~10 minute build.
      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DX_VERSION }}

      - name: Work out the version and artifact suffix
        id: v
        run: |
          VERSION=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)
          echo "version=$VERSION"          >> "$GITHUB_OUTPUT"
          echo "suffix=ubuntu-${{ matrix.ubuntu }}" >> "$GITHUB_OUTPUT"
          echo "packaging $VERSION for ubuntu ${{ matrix.ubuntu }}"

      # the GUI half: .deb + AppImage, straight from the bundler
      #
      # --cargo-args needs the `=` form: a value starting with `-` is read as
      # the next flag otherwise.
      - name: Bundle the desktop app
        working-directory: app
        run: |
          dx bundle --release --platform linux \
            --package-types deb --package-types appimage \
            --cargo-args="--locked" \
            --out-dir "$GITHUB_WORKSPACE/staging"

      # the headless half: server + crawler, no GTK, no webkit
      #
      # `--no-default-features --features local` is what keeps dioxus, wry and
      # GTK out of this build entirely; the app binary is skipped because its
      # required-features include `gui`.
      - name: Build the server and headless tools
        run: |
          cargo build --release --locked --manifest-path app/Cargo.toml \
            --no-default-features --features local --bins
          cargo build --release --locked --manifest-path server/Cargo.toml

      # dx leaves Depends and Maintainer blank; finish-deb.sh fills them in,
      # computing Depends with dpkg-shlibdeps against this runner's release.
      - name: Finish the desktop .deb
        run: |
          mkdir -p dist
          chmod +x .github/scripts/finish-deb.sh
          dpkg-deb -R staging/*_amd64.deb debroot
          .github/scripts/finish-deb.sh debroot \
            "dist/two-khz_${{ steps.v.outputs.version }}_amd64.${{ steps.v.outputs.suffix }}.deb" \
            "$MAINTAINER"
          rm -f staging/*_amd64.deb

      - name: Build the server .deb
        run: |
          R=serverroot
          mkdir -p "$R/DEBIAN" "$R/usr/bin" "$R/usr/share/two-khz" \
                   "$R/usr/share/doc/two-khz-server"
          install -m755 server/target/release/two-khz-server "$R/usr/bin/two-khz-server"
          install -m755 app/target/release/crawl             "$R/usr/bin/two-khz-crawl"
          install -m755 app/target/release/parity            "$R/usr/bin/two-khz-parity"
          install -m644 schema.sql "$R/usr/share/two-khz/schema.sql"
          install -m644 README.md  "$R/usr/share/doc/two-khz-server/README.md"
          sed -e "s/@VERSION@/${{ steps.v.outputs.version }}/" \
            > "$R/DEBIAN/control" <<'EOF'
          Package: two-khz-server
          Version: @VERSION@
          Architecture: amd64
          Section: sound
          Priority: optional
          Homepage: https://github.com/nab-os/2kHz
          Description: Headless half of 2kHz: API server, crawler and pipeline runner
           Owns the Qobuz credentials, the SQLite corpus, the pipeline stages and
           the CLAP text tower, and serves them to 2kHz clients over HTTP. No GUI:
           this package deliberately links neither GTK nor webkit.
          EOF
          .github/scripts/finish-deb.sh "$R" \
            "dist/two-khz-server_${{ steps.v.outputs.version }}_amd64.${{ steps.v.outputs.suffix }}.deb" \
            "$MAINTAINER"

      - name: Build the tarballs
        run: |
          V=${{ steps.v.outputs.version }}
          S=${{ steps.v.outputs.suffix }}
          T=$(mktemp -d)

          mkdir -p "$T/two-khz-$V"
          cp app/target/dx/two-khz-app/release/linux/app/two-khz-app "$T/two-khz-$V/"
          cp README.md "$T/two-khz-$V/"
          cp -r app/assets/icons "$T/two-khz-$V/icons"
          tar -C "$T" -czf "dist/two-khz_${V}_${S}.tar.gz" "two-khz-$V"

          mkdir -p "$T/two-khz-server-$V"
          cp server/target/release/two-khz-server "$T/two-khz-server-$V/"
          cp app/target/release/crawl  "$T/two-khz-server-$V/two-khz-crawl"
          cp app/target/release/parity "$T/two-khz-server-$V/two-khz-parity"
          cp schema.sql README.md "$T/two-khz-server-$V/"
          tar -C "$T" -czf "dist/two-khz-server_${V}_${S}.tar.gz" "two-khz-server-$V"

      - name: Collect the AppImage
        run: |
          mv staging/*.AppImage \
            "dist/two-khz_${{ steps.v.outputs.version }}_${{ steps.v.outputs.suffix }}.AppImage"

      - name: Verify the packages
        run: |
          for f in dist/*.deb; do
            echo "=== $f"
            dpkg-deb -I "$f" | grep -E '^ (Package|Version|Depends|Maintainer):'
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.ubuntu }}
          path: dist/*
          if-no-files-found: error

  # -------------------------------------------------------------- android
  #
  # Skipped for pull requests from forks, which structurally cannot read the
  # signing secrets this job requires.
  android:
    name: android (arm64)
    runs-on: ubuntu-24.04
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Fail early if the signing secrets are missing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=
          [ -n "$KEYSTORE" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PASS" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ]      || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Release signing is required but these secrets are unset:$missing"
            echo "Create a keystore with:"
            echo "  keytool -genkeypair -v -keystore two-khz.jks -alias two-khz \\"
            echo "    -keyalg RSA -keysize 4096 -validity 10000"
            echo "then add 'base64 -w0 two-khz.jks' as ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: android

      - uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y --locked dioxus-cli@${{ env.DX_VERSION }}

      - name: Work out the version
        id: v
        run: echo "version=$(grep -m1 '^version' app/Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # android-env.sh honours a pre-set ANDROID_NDK_HOME, so point it at the
      # NDK the runner image already ships rather than downloading another one.
      # API 26 is the floor for the WebView features wry uses.
      - name: Configure the NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME"         >> "$GITHUB_ENV"
          echo "using NDK: $ANDROID_NDK_LATEST_HOME"

      # arm64 only, and not by choice: manganis, the asset crate dioxus pulls
      # in, is compile_error! on 32-bit Android. --target is load-bearing,
      # without it dx builds x86_64 for an emulator, which will not install
      # on a phone.
      - name: Build the APK
        working-directory: app
        run: |
          . ./android-env.sh
          dx bundle --release --platform android \
            --target aarch64-linux-android \
            --no-default-features --features mobile \
            --package-types apk \
            --cargo-args="--locked" \
            --out-dir "$GITHUB_WORKSPACE/staging"

      - name: Sign the APK
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OUT: dist/two-khz_${{ steps.v.outputs.version }}_arm64.apk
        run: |
          set -euo pipefail
          mkdir -p dist

          APK=$(find staging -name '*.apk' | head -1)
          [ -n "$APK" ] || { echo "::error::dx produced no .apk"; find staging -type f; exit 1; }
          echo "signing $APK"

          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          KS=$(mktemp -d)/ks.jks
          printf '%s' "$KEYSTORE" | base64 -d > "$KS"

          # zipalign must run before apksigner: v2+ signatures cover the whole
          # archive, so realigning afterwards would invalidate them.
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          "$BT/apksigner" sign \
            --ks "$KS" --ks-pass "pass:$STORE_PASS" \
            --ks-key-alias "$ALIAS" \
            --key-pass "pass:${KEY_PASS:-$STORE_PASS}" \
            --out "$OUT" \
            aligned.apk
          rm -f "$KS" aligned.apk

          "$BT/apksigner" verify --verbose --print-certs "$OUT"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------- release
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - run: ls -lhR artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
