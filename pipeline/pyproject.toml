[project]
name = "two_khz"
version = "0.1.0"
description = "Offline pipeline: crawl Qobuz, analyse audio, build a music vector space"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "numpy>=2.0",
]

# The heavy ML stack is optional, so crawling works without TensorFlow and
# torch. Install with: uv sync --extra extract
[project.optional-dependencies]
extract = [
    # Only release shipping a cp312 manylinux x86_64 wheel.
    "essentia-tensorflow==2.1b6.dev1389",
    "torch>=2.4",
    "transformers>=4.40",
    "soundfile>=0.12",
    "onnxruntime>=1.30.0",
    "onnx>=1.23.0",
]
layout = [
    "umap-learn>=0.5.12",
    "scikit-learn>=1.5",
]

[project.scripts]
two-khz = "two_khz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["two_khz"]
